[package]
name = "shilu"
version = "0.1.0"
description = "ShiLu Windows desktop knowledge archive"
authors = ["ShiLu"]
edition = "2021"

[lib]
name = "shilu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.3.0"
tauri-plugin-fs = "2.3.0"
tauri-plugin-opener = "2.3.0"
windows = { version = "0.61", features = ["Foundation", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
